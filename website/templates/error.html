{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card-pc card-body-pc text-center py-5 my-4 mx-auto" style="max-width: 560px">
  <div class="tw-text-6xl fw-800 tw-text-brand-700 mono">{{ code }}</div>
  <h1 class="h4 fw-bold mt-2">{{ title }}</h1>
  <p class="text-muted-2">{{ message }}</p>
  <a class="btn btn-brand" href="{{ url_for('dashboard.index') }}"><i class="bi bi-house-door me-2"></i>Back to dashboard</a>
</div>
{% endblock %}
