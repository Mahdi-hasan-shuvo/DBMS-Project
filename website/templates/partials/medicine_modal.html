<div class="modal fade" id="medicineModal" tabindex="-1" aria-labelledby="medicineModalTitle" aria-hidden="true" data-record-modal>
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <form class="modal-content" method="post" action="{{ url_for('medicines.create') }}">
      <div class="modal-header">
        <div>
          <h5 class="modal-title" id="medicineModalTitle" data-modal-title>Add New Medicine</h5>
          <div class="tw-text-xs text-muted-2 mono">INSERT / UPDATE medicines</div>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" name="next" value="{{ request.full_path }}">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="m_name">Medicine name *</label>
            <input class="form-control" id="m_name" name="medicine_name" required maxlength="150" placeholder="e.g. Amoxil 500mg">
          </div>
          <div class="col-md-6">
            <label class="form-label" for="m_generic">Generic / formulation</label>
            <input class="form-control" id="m_generic" name="generic_name" maxlength="150" placeholder="e.g. Amoxicillin Trihydrate">
          </div>
          <div class="col-md-4">
            <label class="form-label" for="m_cat">Category *</label>
            <select class="form-select" id="m_cat" name="category_id" required>
              <option value="">Select category</option>
              {% for c in all_categories %}<option value="{{ c.category_id }}">{{ c.category_name }}</option>{% endfor %}
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label" for="m_form">Dosage form</label>
            <input class="form-control" id="m_form" name="dosage_form" maxlength="50" list="dosageForms" placeholder="Tablet">
            <datalist id="dosageForms">
              {% for f in ['Tablet', 'Capsule', 'Caplet', 'Film Tablet', 'Syrup 100ml', 'Injection', 'Inhaler', 'Cream 20g', 'Drops 10ml', 'Pen'] %}<option value="{{ f }}">{% endfor %}
            </datalist>
          </div>
          <div class="col-md-4">
            <label class="form-label" for="m_mfr">Manufacturer</label>
            <input class="form-control" id="m_mfr" name="manufacturer" maxlength="120">
          </div>
          <div class="col-md-4">
            <label class="form-label" for="m_sku">SKU (unique)</label>
            <input class="form-control mono" id="m_sku" name="sku" maxlength="40" placeholder="AMO-101">
          </div>
          <div class="col-md-4">
            <label class="form-label" for="m_batch">Batch / lot no.</label>
            <input class="form-control mono" id="m_batch" name="batch_no" maxlength="40" placeholder="LOT-1234">
          </div>
          <div class="col-md-4">
            <label class="form-label" for="m_exp">Expiry date *</label>
            <input class="form-control" type="date" id="m_exp" name="expiry_date" required>
          </div>
          <div class="col-md-3 col-6">
            <label class="form-label" for="m_cost">Cost price ({{ currency }})</label>
            <input class="form-control" type="number" step="0.01" min="0" id="m_cost" name="cost_price" placeholder="0.00">
          </div>
          <div class="col-md-3 col-6">
            <label class="form-label" for="m_price">Selling price ({{ currency }}) *</label>
            <input class="form-control" type="number" step="0.01" min="0" id="m_price" name="price" required placeholder="0.00">
          </div>
          <div class="col-md-3 col-6">
            <label class="form-label" for="m_reorder">Reorder level</label>
            <input class="form-control" type="number" min="0" step="1" id="m_reorder" name="reorder_level" value="20">
          </div>
          <div class="col-md-3 col-6" data-create-only>
            <label class="form-label" for="m_stock">Opening stock</label>
            <input class="form-control" type="number" min="0" step="1" id="m_stock" name="stock_quantity" value="0">
          </div>
          <div class="col-md-3 col-6 d-none" data-edit-only>
            <label class="form-label">Current stock</label>
            <div class="form-control bg-light" data-field-text="stock_quantity">0</div>
          </div>
        </div>
        <div class="note-box mt-3 d-none" data-edit-only>
          <i class="bi bi-info-circle me-1"></i> Stock quantity is changed by purchases (adds) and sales (deducts) so the
          inventory always matches transaction history.
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-soft" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-brand"><i class="bi bi-check2-circle me-1"></i> Save Medicine</button>
      </div>
    </form>
  </div>
</div>
