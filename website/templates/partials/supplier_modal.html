<div class="modal fade" id="supplierModal" tabindex="-1" aria-labelledby="supplierModalTitle" aria-hidden="true" data-record-modal>
  <div class="modal-dialog modal-lg">
    <form class="modal-content" method="post" action="{{ url_for('suppliers.create') }}">
      <div class="modal-header">
        <div>
          <h5 class="modal-title" id="supplierModalTitle" data-modal-title>Add Supplier</h5>
          <div class="tw-text-xs text-muted-2 mono">INSERT / UPDATE suppliers</div>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" name="next" value="{{ request.full_path }}">
        <div class="row g-3">
          <div class="col-md-7">
            <label class="form-label" for="s_name">Distributor / company *</label>
            <input class="form-control" id="s_name" name="supplier_name" required maxlength="150">
          </div>
          <div class="col-md-5">
            <label class="form-label" for="s_contact">Contact person</label>
            <input class="form-control" id="s_contact" name="contact_person" maxlength="100">
          </div>
          <div class="col-md-6">
            <label class="form-label" for="s_phone">Phone *</label>
            <input class="form-control" id="s_phone" name="phone" required maxlength="30" placeholder="+1 (555) 000-0000">
          </div>
          <div class="col-md-6">
            <label class="form-label" for="s_email">Email</label>
            <input class="form-control" type="email" id="s_email" name="email" maxlength="120">
          </div>
          <div class="col-md-8">
            <label class="form-label" for="s_addr">Address</label>
            <input class="form-control" id="s_addr" name="address" maxlength="255">
          </div>
          <div class="col-md-4">
            <label class="form-label" for="s_city">City</label>
            <input class="form-control" id="s_city" name="city" maxlength="80">
          </div>
          <div class="col-md-6">
            <label class="form-label" for="s_terms">Payment terms</label>
            <select class="form-select" id="s_terms" name="payment_terms">
              {% for t in terms %}<option {{ 'selected' if t == 'Net 30' }}>{{ t }}</option>{% endfor %}
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="s_status">Status</label>
            <select class="form-select" id="s_status" name="status">
              {% for s in statuses %}<option>{{ s }}</option>{% endfor %}
            </select>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-soft" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-brand"><i class="bi bi-check2-circle me-1"></i> Save Supplier</button>
      </div>
    </form>
  </div>
</div>
